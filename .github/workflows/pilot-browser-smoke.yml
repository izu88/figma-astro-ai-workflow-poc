name: Pilot browser screenshots

on:
  pull_request:
    paths:
      - "src/pages/pilot/**"
      - "src/components/pilot/**"
      - "src/layouts/BaseLayout.astro"
      - "src/styles/page/_pilot.scss"
      - "src/styles/style.scss"
      - "scripts/pilot-http-smoke.mjs"
      - "scripts/pilot-browser-qa.mjs"
      - ".github/workflows/pilot-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: npm run qa:agent
      - name: Install Japanese fallback fonts for screenshot fidelity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Install pinned Playwright without changing the lockfile
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install chromium
      - name: Check real browser and capture screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4321/pilot/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/pilot-http-smoke.mjs
          node scripts/pilot-browser-qa.mjs
      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figma-astro-pilot-screenshots
          path: pilot-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
